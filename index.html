<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语言加密器（完美单音+词组撤回版）</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --sub: #94a3b8;
    --primary: #0ea5e9; --success: #22c55e; --danger: #f87171;
    --border: #334155; --input-bg: #0b1220;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; justify-content: center; padding: 20px;
  }
  .app { width: 100%; max-width: 760px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: var(--sub); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  label { display: block; font-size: 14px; color: #cbd5e1; margin: 12px 0 6px; }
  textarea, input {
    width: 100%; border: 1px solid var(--border); background: var(--input-bg);
    color: #f8fafc; border-radius: 10px; padding: 12px; font-size: 15px; outline: none;
  }
  textarea { min-height: 120px; resize: vertical; line-height: 1.8; font-family: monospace, sans-serif; }
  input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,233,.15); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  button {
    border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px;
    font-weight: 600; cursor: pointer; background: #334155; color: #f8fafc; transition: .15s;
  }
  button:hover { background: #475569; }
  button.primary { background: var(--primary); color: white; }
  button.primary:hover { background: #0284c7; }
  button.success { background: var(--success); color: #052e16; }
  button.success:hover { background: #16a34a; }
  button.danger { background: #7f1d1d; color: #fca5a5; }
  button.danger:hover { background: #991b1b; }
  button.info { background: #4c1d95; color: #ddd6fe; }
  button.info:hover { background: #5b21b6; }
  button.undo { background: #b45309; color: #fef3c7; }
  button.undo:hover { background: #92400e; }
  .status { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--sub); }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }
  .output-box {
    margin-top: 10px; padding: 12px; border: 1px dashed var(--border); border-radius: 10px;
    background: var(--input-bg); min-height: 80px; font-size: 16px; line-height: 1.8; word-break: break-all;
  }
  .clickable-char { cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background 0.2s; color: #fca5a5; }
  .clickable-char:hover { background: #334155; color: #f8fafc; }
  .corrected-char { color: #4ade80; } 
  #errorLog { color: #fca5a5; font-size: 12px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div id="errorLog"></div>

<div class="app">
  <h1>🔐 语言加密器</h1>
  <div class="sub">自然码双拼 → 声调箭头 → 键盘符号 → 全能词组记忆</div>
  
  <div class="card">
    <label for="inputText">输入原文（中文）或密文</label>
    <textarea id="inputText" placeholder="输入中文进行加密，或粘贴密文进行解密..."></textarea>
    
    <div class="row">
      <button class="primary" onclick="encryptText()">加密</button>
      <button class="success" onclick="decryptText()">解密</button>
      <button onclick="copyResult()">复制结果</button>
      <button class="undo" onclick="undoLast()">↩️ 撤回上一步</button>
      <button class="danger" onclick="clearAll()">清空</button>
    </div>

    <label>结果（点击<span style="color:#fca5a5;">红色字</span>可纠正，纠正后变绿）</label>
    <div id="outputText" class="output-box"></div>
    <div id="status" class="status"></div>

    <div class="row" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
      <button class="info" onclick="exportMemory()">📤 导出记忆库</button>
      <button class="info" onclick="importMemory()">📥 导入记忆库</button>
      <button class="danger" onclick="clearMemory()">🗑️ 清空记忆库</button>
    </div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 8px;">
      💡 提示：点击红字后，可以输入任意长度的词组。如果改错了，点击“撤回上一步”即可恢复。
    </div>
  </div>
</div>

let memoryBank = {};
try { memoryBank = JSON.parse(localStorage.getItem('cryptoMemory') || '{}'); } catch(e) {}

// ==========================================
// 3. 双拼转换逻辑 (修复单音字)
// ==========================================
function convertToShuangpin(pinyin) {
  if (!pinyin) return null;
  let initial = '', rest = pinyin;
  if (pinyin.startsWith('zh')) { initial = 'zh'; rest = pinyin.slice(2); }
  else if (pinyin.startsWith('ch')) { initial = 'ch'; rest = pinyin.slice(2); }
  else if (pinyin.startsWith('sh')) { initial = 'sh'; rest = pinyin.slice(2); }
  else if ('bpmfdtnlgkhjqxrzcsyw'.includes(pinyin[0])) { initial = pinyin[0]; rest = pinyin.slice(1); }

  const mappedInitial = zrmInitialMap[initial] || '';
  let mappedVowel = rest;
  if (zrmVowelMap[rest]) mappedVowel = zrmVowelMap[rest];
  else {
    for (let len = rest.length; len > 0; len--) {
      const sub = rest.slice(0, len);
      if (zrmVowelMap[sub]) { mappedVowel = zrmVowelMap[sub] + rest.slice(len); break; }
    }
  }
  // 【修复】不再重复单音字母，直接返回1个字母。
  return mappedInitial + mappedVowel;
}

function convertFromShuangpin(sp) {
  if (!sp || sp.length < 1) return null;
  const first = sp[0];
  
  // 【修复】取消重复字母 aa, oo, ee 的特殊判断

  if (sp.length === 1) {
      // 如果是单字母（如 a, o, e），直接返回该字母作为拼音
      if (reverseVowelMap[first]) return reverseVowelMap[first][0];
      return first;
  }

  const second = sp[1];
  if (!reverseInitialMap[first] && reverseVowelMap[first]) return reverseVowelMap[first][0];
  const initial = reverseInitialMap[first] || first;
  let vowel = (reverseVowelMap[second] || [second])[0];
  if (['y','j','q','x'].includes(initial) && second === 't') vowel = 'ue';
  if (second === 'o' && 'dtnlgkhzcsr'.includes(initial)) vowel = 'uo';
  if (initial === 'y' && second === 'v') vowel = 'u';
  if (['j','q','x'].includes(initial) && second === 'v') vowel = 'u';
  return initial + vowel;
}

function getPinyinForChar(char) {
  for (const [pinyinWithTone, chars] of Object.entries(pinyinDict)) {
    if (chars.includes(char)) {
      const tone = parseInt(pinyinWithTone.match(/(\d)$/)[1]) || 5;
      return { pinyin: pinyinWithTone.replace(/\d$/, ''), tone: tone };
    }
  }
  return null;
}

// ==========================================
// 4. 加密与解密
// ==========================================
function encryptText() {
  let text = document.getElementById('inputText').value;
  if (!text) { setStatus('请输入原文', 'error'); return; }
  let encryptedResult = '';
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (punctPlaceholder[char]) { encryptedResult += punctPlaceholder[char]; continue; }
    if (/[\u4e00-\u9fa5]/.test(char)) {
      const pinyinData = getPinyinForChar(char);
      if (pinyinData) {
        const sp = convertToShuangpin(pinyinData.pinyin);
        if (sp) {
          for (let j = 0; j < sp.length; j++) encryptedResult += (keyboardMap[sp[j]] || sp[j]);
          encryptedResult += (toneMap[pinyinData.tone] || '');
        } else encryptedResult += char;
      } else encryptedResult += char;
    } else encryptedResult += char;
  }
  document.getElementById('outputText').innerText = encryptedResult;
  setStatus('加密完成', 'ok');
}

let currentPinyinList = [];

function decryptText() {
  let text = document.getElementById('inputText').value.trim();
  if (!text) { setStatus('请输入密文', 'error'); return; }

  let rawText = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (reverseKeyboardMap[ch]) rawText += reverseKeyboardMap[ch];
    else if (reversePunctPlaceholder[ch]) rawText += reversePunctPlaceholder[ch];
    else rawText += ch;
  }

  // 【修复】正则改为 {1,2}，智能匹配 1个或2个字母
  const regex = /([a-z]{1,2})(→|↑|←|↓|\\)/g;
  let match, lastIndex = 0;
  currentPinyinList = [];

  while ((match = regex.exec(rawText)) !== null) {
    if (match.index > lastIndex) currentPinyinList.push({ type: 'raw', text: rawText.substring(lastIndex, match.index) });
    const pinyin = convertFromShuangpin(match[1]);
    const toneNumber = reverseToneMap[match[2]] || 5;
    const pinyinWithTone = pinyin ? pinyin + toneNumber : match[1] + match[2];
    currentPinyinList.push({ 
      type: 'char', shuangpin: match[1], tone: match[2], key: pinyinWithTone, text: '' 
    });
    lastIndex = regex.lastIndex;
  }
  if (lastIndex < rawText.length) currentPinyinList.push({ type: 'raw', text: rawText.substring(lastIndex) });

  let finalChars = [];
  let i = 0;
  while (i < currentPinyinList.length) {
    const item = currentPinyinList[i];
    if (item.type === 'raw') { 
        finalChars.push({ type: 'raw', text: item.text }); 
        i++; 
        continue; 
    }

    let decodedChar = '';
    let isMemory = false;
    let currentPinyin = item.key;

    let matchedWord = false;
    for (let len = 4; len >= 2; len--) {
        if (i + len - 1 < currentPinyinList.length) {
            let allChars = true;
            for(let k=1; k<len; k++) {
                if(currentPinyinList[i+k].type !== 'char') { allChars = false; break; }
            }
            if (allChars) {
                let wordPinyin = '';
                for(let k=0; k<len; k++) {
                    wordPinyin += (k>0?'_':'') + currentPinyinList[i+k].key;
                }
                const wordKey = `W:${wordPinyin}`;
                if (memoryBank[wordKey]) {
                    decodedChar = memoryBank[wordKey];
                    item.text = decodedChar;
                    finalChars.push({ type: 'char', text: decodedChar, key: wordKey, isMemory: true, index: i, length: len });
                    i += len;
                    matchedWord = true;
                    break;
                }
            }
        }
    }
    if (matchedWord) continue;

    let prevPinyin = (i > 0 && currentPinyinList[i-1].type === 'char') ? currentPinyinList[i-1].key : '';
    let nextPinyin = (i < currentPinyinList.length - 1 && currentPinyinList[i+1].type === 'char') ? currentPinyinList[i+1].key : '';

    const keyFull = `F:${prevPinyin}|${currentPinyin}|${nextPinyin}`;
    const keyPrev = `P:${prevPinyin}|${currentPinyin}`;
    const keyNext = `N:${currentPinyin}|${nextPinyin}`;
    const keySingle = `S:${currentPinyin}`;

    if (memoryBank[keyFull]) { decodedChar = memoryBank[keyFull]; isMemory = true; }
    else if (memoryBank[keyPrev]) { decodedChar = memoryBank[keyPrev]; isMemory = true; }
    else if (memoryBank[keyNext]) { decodedChar = memoryBank[keyNext]; isMemory = true; }
    else if (memoryBank[keySingle]) { decodedChar = memoryBank[keySingle]; isMemory = true; }
    else {
      const candidates = pinyinDict[currentPinyin];
      if (candidates && candidates.length > 0) decodedChar = candidates[0];
      else decodedChar = `[${currentPinyin}]`;
    }

    item.text = decodedChar;
    finalChars.push({ type: 'char', text: decodedChar, key: currentPinyin, isMemory: isMemory, index: i, length: 1 });
    i++;
  }

  renderClickableOutput(finalChars);
  setStatus('解密完成。点击红色字可修正。', 'ok');
}

function renderClickableOutput(finalChars) {
  const outputBox = document.getElementById('outputText');
  outputBox.innerHTML = '';
  for (const item of finalChars) {
    if (item.type === 'raw') {
      let text = item.text;
      for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (reversePunctPlaceholder[ch]) outputBox.appendChild(document.createTextNode(reversePunctPlaceholder[ch]));
          else outputBox.appendChild(document.createTextNode(ch));
      }
    } else {
      const span = document.createElement('span');
      span.className = 'clickable-char';
      if (item.isMemory) span.classList.add('corrected-char');
      span.innerText = item.text;
      span.dataset.key = item.key;
      span.dataset.index = item.index;
      span.dataset.length = item.length; 
      span.onclick = () => correctChar(span);
      outputBox.appendChild(span);
    }
  }
}

// ---------- 记忆修改与撤回核心逻辑 ----------
function correctChar(span) {
  const currentChar = span.innerText;
  const idx = parseInt(span.dataset.index);

  let promptText = `当前是「${currentChar}」。\n请输入正确的字或词组（如“真美”、“珍珠”、“那真珠”）：`;
  if (currentChar.startsWith('[')) promptText = `字典没收录这个音。\n请输入对应的字或词组：`;
  
  const userInput = prompt(promptText, currentChar.startsWith('[') ? '' : currentChar);
  if (!userInput || userInput === currentChar) return;
  const inputChars = Array.from(userInput.trim());

  if (inputChars.length === 0) return;

  let availableChars = 0;
  for (let k = 0; k < inputChars.length; k++) {
      if (idx + k < currentPinyinList.length && currentPinyinList[idx + k].type === 'char') {
          availableChars++;
      } else {
          break; 
      }
  }

  if (availableChars < inputChars.length) {
      setStatus(`当前上下文不足以合并这么长的词组（需要 ${inputChars.length} 个字，但后面只有 ${availableChars} 个）`, 'error');
      return;
  }

  historyStack.push(JSON.parse(JSON.stringify(memoryBank)));
  if (historyStack.length > 30) historyStack.shift(); 

  let wordPinyin = '';
  for (let k = 0; k < inputChars.length; k++) {
      wordPinyin += (k > 0 ? '_' : '') + currentPinyinList[idx + k].key;
  }

  const wordKey = `W:${wordPinyin}`;
  memoryBank[wordKey] = userInput;
  
  if (inputChars.length === 1) {
      const pinyinKey = currentPinyinList[idx].key;
      let prevPinyin = (idx > 0 && currentPinyinList[idx-1].type === 'char') ? currentPinyinList[idx-1].key : '';
      let nextPinyin = (idx + 1 < currentPinyinList.length && currentPinyinList[idx+1].type === 'char') ? currentPinyinList[idx+1].key : '';
      memoryBank[`F:${prevPinyin}|${pinyinKey}|${nextPinyin}`] = userInput;
      memoryBank[`P:${prevPinyin}|${pinyinKey}`] = userInput;
      memoryBank[`N:${pinyinKey}|${nextPinyin}`] = userInput;
      memoryBank[`S:${pinyinKey}`] = userInput;
  }

  setStatus(`已记住搭配：${userInput}`, 'ok');

  const parent = span.parentElement;
  const allSpans = Array.from(parent.querySelectorAll('.clickable-char'));
  const currentSpanIdx = allSpans.indexOf(span);

  span.innerText = inputChars[0];
  span.classList.add('corrected-char');
  span.dataset.length = inputChars.length;

  for (let k = 1; k < inputChars.length; k++) {
      if (currentSpanIdx + k < allSpans.length) {
          const nextSpan = allSpans[currentSpanIdx + k];
          nextSpan.innerText = inputChars[k];
          nextSpan.classList.add('corrected-char');
          nextSpan.dataset.length = 0; 
      }
  }

  try { localStorage.setItem('cryptoMemory', JSON.stringify(memoryBank)); } catch(e) {}
}

// ---------- 撤回功能 ----------
function undoLast() {
  if (historyStack.length === 0) {
    setStatus('没有可以撤回的操作了', 'error');
    return;
  }
  memoryBank = historyStack.pop(); 
  try { localStorage.setItem('cryptoMemory', JSON.stringify(memoryBank)); } catch(e) {}
  
  decryptText();
  setStatus('已撤回上一步修改', 'ok');
}

// ==========================================
// 5. 记忆库管理
// ==========================================
function exportMemory() {
  const data = JSON.stringify(memoryBank);
  if (data === '{}') { alert('记忆库为空'); return; }
  const textarea = document.createElement('textarea');
  textarea.value = data;
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  prompt('记忆库已复制！请粘贴到备忘录保存。下次使用前，点“导入记忆库”粘贴此内容：', data);
}

function importMemory() {
  const data = prompt('请粘贴之前导出的记忆库内容：');
  if (!data) return;
  try {
    memoryBank = { ...memoryBank, ...JSON.parse(data) };
    localStorage.setItem('cryptoMemory', JSON.stringify(memoryBank));
    setStatus('记忆库导入成功！', 'ok');
  } catch(e) { setStatus('导入失败，数据格式不正确', 'error'); }
}

function clearMemory() {
  if (confirm('确定要清空所有记忆库吗？这将删除你所有的纠正记录！')) {
    memoryBank = {};
    historyStack = [];
    localStorage.removeItem('cryptoMemory');
    setStatus('记忆库已清空', 'ok');
  }
}

// ==========================================
// 6. 辅助 UI
// ==========================================
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function copyResult() {
  const outputBox = document.getElementById('outputText');
  const text = outputBox.innerText || outputBox.textContent;
  if (!text.trim()) { setStatus('没有可复制的内容', 'error'); return; }
  navigator.clipboard.writeText(text).then(() => setStatus('已复制到剪贴板', 'ok')).catch(() => {
    const range = document.createRange(); range.selectNode(outputBox);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
    document.execCommand('copy'); setStatus('已复制到剪贴板', 'ok');
  });
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('outputText').innerHTML = '';
  historyStack = [];
  setStatus('');
}
